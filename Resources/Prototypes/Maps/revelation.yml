- type: gameMap
  id: Revelation
  mapName: 'Revelation'
  mapPath: /Maps/revelation-survival.yml
  minPlayers: 0
  maxPlayers: 7
  stations:
    Survival:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Survival {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SL2'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs: # 15 jobs total w/o latejoins, 19 jobs total w/ latejoins
            #civilian (1+)
            Passenger: [ -1, -1 ] #infinite, not counted
